---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:develop_freqai
    # image: freqtradeorg/freqtrade:develop
    # image: freqtradeorg/freqtrade:stable
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROK_MODEL=grok-3-mini
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE__EXCHANGE__KEY}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE__EXCHANGE__SECRET}
      # FREQAI_* strategy knobs (brain's promote.apply_promotion writes these to .env;
      # without explicit mapping here, restarts wouldn't propagate the new values to the
      # strategy. Defaults match the strategy's defaults so missing vars are safe.)
      - FREQAI_K_TP=${FREQAI_K_TP:-2.0}
      - FREQAI_K_SL=${FREQAI_K_SL:-1.0}
      - FREQAI_LONG_THRESHOLD=${FREQAI_LONG_THRESHOLD:-1.0}
      - FREQAI_SHORT_THRESHOLD=${FREQAI_SHORT_THRESHOLD:--1.0}
      - FREQAI_STABILITY_N=${FREQAI_STABILITY_N:-2}
      - FREQAI_FEATURE_SET=${FREQAI_FEATURE_SET:-all}
      - FREQAI_ML_THRESHOLD=${FREQAI_ML_THRESHOLD:-0.60}
      - BTC_MA200_GATE=${BTC_MA200_GATE:-0}
      - FINBUDDY_RECENT_WR=${FINBUDDY_RECENT_WR:-0.50}
      # Confidence-based leverage tiers (added 2026-05-20)
      - FREQAI_LEV_LOW_CONF_RATIO=${FREQAI_LEV_LOW_CONF_RATIO:-1.0}
      - FREQAI_LEV_MED_CONF_RATIO=${FREQAI_LEV_MED_CONF_RATIO:-1.5}
      - FREQAI_LEV_HIGH_CONF_RATIO=${FREQAI_LEV_HIGH_CONF_RATIO:-2.0}
      - FREQAI_LEV_LOW=${FREQAI_LEV_LOW:-1.0}
      - FREQAI_LEV_MED=${FREQAI_LEV_MED:-2.0}
      - FREQAI_LEV_HIGH=${FREQAI_LEV_HIGH:-3.0}
      # Circuit breaker — stop new trades when daily loss exceeds limit (added 2026-05-23)
      - FREQAI_DAILY_LOSS_LIMIT=${FREQAI_DAILY_LOSS_LIMIT:-10}
      # Tier 2: flatten all open positions at limit × mult (added 2026-06-11)
      - FREQAI_DAILY_FLATTEN_MULT=${FREQAI_DAILY_FLATTEN_MULT:-1.5}
      # Re-entry cooldown after stop-loss, in candles (added 2026-06-11)
      - FREQAI_REENTRY_COOLDOWN_CANDLES=${FREQAI_REENTRY_COOLDOWN_CANDLES:-8}
      # Phase B/C entry-overhaul gates (added 2026-06-12 — default off until promoted).
      # Compose env is an explicit list: a var missing here NEVER reaches the
      # container even if set in .env (hard-learned 2026-05-23).
      - FREQAI_ENTRY_MODE=${FREQAI_ENTRY_MODE:-absolute}
      - FREQAI_ENTRY_QUANTILE=${FREQAI_ENTRY_QUANTILE:-0.92}
      - FREQAI_ENTRY_ABS_FLOOR=${FREQAI_ENTRY_ABS_FLOOR:-0.10}
      - FREQAI_BOUNCE_GUARD=${FREQAI_BOUNCE_GUARD:-0}
      - FREQAI_PRUNE_INDICATORS=${FREQAI_PRUNE_INDICATORS:-0}
      - FREQAI_PERPAIR_OI=${FREQAI_PERPAIR_OI:-0}
      - FREQAI_TREND_HORIZON=${FREQAI_TREND_HORIZON:-0}
      # Time-limit exit: candle count = model's label_period_candles horizon (added 2026-05-28)
      - FREQAI_LABEL_CANDLES=${FREQAI_LABEL_CANDLES:-12}
      - FREQTRADE__FREQAI__IDENTIFIER=${FREQTRADE__FREQAI__IDENTIFIER:-}
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "/home/ubuntu/var/www/html/trade/finbuddy_memory:/freqtrade/finbuddy_memory:ro"
      # WR feedback state dir — recent_wr.json at /home/ubuntu/.finbuddy/state/recent_wr.json
      # Strategy reads this file via _load_recent_wr() to adjust thresholds dynamically.
      # Without this mount the strategy silently falls back to wr=0.50 (WR feedback disabled).
      # Added 2026-05-27 to re-enable the bidirectional threshold adjustment (Fix 8).
      - "/home/ubuntu/.finbuddy:/home/ubuntu/.finbuddy:ro"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "8080:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
