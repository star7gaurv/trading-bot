---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:develop_freqai
    # image: freqtradeorg/freqtrade:develop
    # image: freqtradeorg/freqtrade:stable
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROK_MODEL=grok-3-mini
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE__EXCHANGE__KEY}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE__EXCHANGE__SECRET}
      # API server auth (2026-07-05): moved out of config.json (which is git-tracked) into
      # .env (gitignored) — same values, just no longer committed in plaintext. Also now
      # only reachable via the loopback-only port publish above.
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE__API_SERVER__USERNAME}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE__API_SERVER__PASSWORD}
      - FREQTRADE__TELEGRAM__TOKEN=${FREQTRADE__TELEGRAM__TOKEN}
      # FREQAI_* strategy knobs (brain's promote.apply_promotion writes these to .env;
      # without explicit mapping here, restarts wouldn't propagate the new values to the
      # strategy. Defaults match the strategy's defaults so missing vars are safe.)
      - FREQAI_K_TP=${FREQAI_K_TP:-2.0}
      - FREQAI_K_SL=${FREQAI_K_SL:-1.0}
      - FREQAI_LONG_THRESHOLD=${FREQAI_LONG_THRESHOLD:-1.0}
      - FREQAI_SHORT_THRESHOLD=${FREQAI_SHORT_THRESHOLD:--1.0}
      - FREQAI_STABILITY_N=${FREQAI_STABILITY_N:-2}
      - FREQAI_FEATURE_SET=${FREQAI_FEATURE_SET:-all}
      - FREQAI_ML_THRESHOLD=${FREQAI_ML_THRESHOLD:-0.60}
      - BTC_MA200_GATE=${BTC_MA200_GATE:-0}
      - FINBUDDY_RECENT_WR=${FINBUDDY_RECENT_WR:-0.50}
      # Confidence-based leverage tiers (added 2026-05-20)
      - FREQAI_LEV_LOW_CONF_RATIO=${FREQAI_LEV_LOW_CONF_RATIO:-1.0}
      - FREQAI_LEV_MED_CONF_RATIO=${FREQAI_LEV_MED_CONF_RATIO:-1.5}
      - FREQAI_LEV_HIGH_CONF_RATIO=${FREQAI_LEV_HIGH_CONF_RATIO:-2.0}
      - FREQAI_LEV_LOW=${FREQAI_LEV_LOW:-1.0}
      - FREQAI_LEV_MED=${FREQAI_LEV_MED:-2.0}
      - FREQAI_LEV_HIGH=${FREQAI_LEV_HIGH:-3.0}
      # Circuit breaker — stop new trades when daily loss exceeds limit (added 2026-05-23)
      - FREQAI_DAILY_LOSS_LIMIT=${FREQAI_DAILY_LOSS_LIMIT:-10}
      # Tier 2: flatten all open positions at limit × mult (added 2026-06-11)
      - FREQAI_DAILY_FLATTEN_MULT=${FREQAI_DAILY_FLATTEN_MULT:-1.5}
      # Re-entry cooldown after stop-loss, in candles (added 2026-06-11)
      - FREQAI_REENTRY_COOLDOWN_CANDLES=${FREQAI_REENTRY_COOLDOWN_CANDLES:-8}
      # Phase B/C entry-overhaul gates (added 2026-06-12 — default off until promoted).
      # Compose env is an explicit list: a var missing here NEVER reaches the
      # container even if set in .env (hard-learned 2026-05-23).
      - FREQAI_ENTRY_MODE=${FREQAI_ENTRY_MODE:-absolute}
      - FREQAI_ENTRY_QUANTILE=${FREQAI_ENTRY_QUANTILE:-0.92}
      - FREQAI_ENTRY_ABS_FLOOR=${FREQAI_ENTRY_ABS_FLOOR:-0.10}
      - FREQAI_TREND_FILTER=${FREQAI_TREND_FILTER:-0}
      - FREQAI_BOUNCE_GUARD=${FREQAI_BOUNCE_GUARD:-0}
      - FREQAI_PRUNE_INDICATORS=${FREQAI_PRUNE_INDICATORS:-0}
      - FREQAI_PERPAIR_OI=${FREQAI_PERPAIR_OI:-0}
      - FREQAI_TREND_HORIZON=${FREQAI_TREND_HORIZON:-0}
      # Capital Preservation Layer (2026-06-16): early-exit a losing trade when the
      # model stops supporting it. DEFAULT OFF — A/B backtest on 20260101-20260401
      # showed it made the bleed WORSE (-553.9 vs -545.6) by churning more trades:
      # the per-candle prediction is too noisy to use as a real-time abandon signal.
      - FREQAI_PRED_DECAY_EXIT=${FREQAI_PRED_DECAY_EXIT:-0}
      - FREQAI_PRED_DECAY_LEVEL=${FREQAI_PRED_DECAY_LEVEL:-0.0}
      # Threshold floor (2026-07-08): effective entry threshold can never drop below
      # the nominal .env value — regime/std multipliers may only tighten. Fixes the
      # measured 2026-06-19 absorption (nominal −0.6 → effective −0.38 in BEAR).
      - FREQAI_THRESHOLD_FLOOR=${FREQAI_THRESHOLD_FLOOR:-1}
      # Lever 3 partial take-profit (2026-07-08): DEFAULT OFF pending brain A/B.
      # Banks FRACTION of the position at TRIGGER × (K_TP×ATR) profit, once per trade.
      - FREQAI_PARTIAL_TP=${FREQAI_PARTIAL_TP:-0}
      - FREQAI_PARTIAL_TP_TRIGGER=${FREQAI_PARTIAL_TP_TRIGGER:-0.5}
      - FREQAI_PARTIAL_TP_FRACTION=${FREQAI_PARTIAL_TP_FRACTION:-0.5}
      # Progress-cut (2026-06-23): DEFAULT OFF. Cut a trade after PROGRESS_CUT_CANDLES
      # with no real price progress, instead of riding it to the full time-limit exit.
      # 2026-07-17: this was missing from docker-compose entirely until now — even a
      # promoted progress_cut winner would have silently deployed OFF (3-layer-gap class).
      - FREQAI_PROGRESS_CUT=${FREQAI_PROGRESS_CUT:-0}
      # NEUTRAL-regime long/short threshold multiplier override (2026-08-31): DEFAULT
      # 1.0/1.0 = byte-identical to the hardcoded _REGIME_THRESHOLD_MULTS value. A/B
      # queued via the brain to test whether shorts need extra caution during chop.
      - FREQAI_NEUTRAL_LONG_MULT=${FREQAI_NEUTRAL_LONG_MULT:-1.0}
      - FREQAI_NEUTRAL_SHORT_MULT=${FREQAI_NEUTRAL_SHORT_MULT:-1.0}
      # NEUTRAL-regime time-limit exit horizon override (2026-08-31): shortens the
      # exit horizon (<1.0) for trades entered during NEUTRAL chop, per direction.
      # DEFAULT 1.0/1.0 = byte-identical to prior behavior.
      - FREQAI_NEUTRAL_EXIT_MULT_LONG=${FREQAI_NEUTRAL_EXIT_MULT_LONG:-1.0}
      - FREQAI_NEUTRAL_EXIT_MULT_SHORT=${FREQAI_NEUTRAL_EXIT_MULT_SHORT:-1.0}
      # Exit-signal hysteresis fraction (2026-08-31): fraction of the entry threshold the
      # prediction must reverse before exit_signal fires. DEFAULT 0.5 = byte-identical prior
      # behavior. A/B queued to see if a different fraction shifts trades toward the good
      # exit_signal path and away from stop_loss/time_limit_exit.
      - FREQAI_EXIT_HYSTERESIS_FRAC=${FREQAI_EXIT_HYSTERESIS_FRAC:-0.5}
      # Trailing-stop leverage/ATR fix (2026-08-31): DEFAULT OFF pending brain A/B. See strategy
      # custom_stoploss comment for the mismatch this corrects.
      - FREQAI_TRAIL_LEVERAGE_FIX=${FREQAI_TRAIL_LEVERAGE_FIX:-0}
      # Persistence-gated prediction-disagreement early exit (2026-09-01): DEFAULT OFF.
      # Redesign of FREQAI_PRED_DECAY_EXIT (single-candle, proven noisy — see that comment
      # above) using the entry-side FREQAI_STABILITY_N pattern: requires N CONSECUTIVE
      # candles of model disagreement before cutting a losing trade early. New, separate
      # exit_reason "pred_persist_exit" so its effect is isolable from pred_decay_exit
      # (which stays OFF). Pending brain A/B.
      - FREQAI_PRED_PERSIST_EXIT=${FREQAI_PRED_PERSIST_EXIT:-0}
      - FREQAI_PRED_PERSIST_EXIT_N=${FREQAI_PRED_PERSIST_EXIT_N:-3}
      - FREQAI_PRED_PERSIST_EXIT_LEVEL=${FREQAI_PRED_PERSIST_EXIT_LEVEL:-0.0}
      - FREQAI_PRED_PERSIST_EXIT_MIN_LOSS=${FREQAI_PRED_PERSIST_EXIT_MIN_LOSS:--0.002}
      # Time-limit grace extension (2026-09-01): DEFAULT OFF (GRACE_CANDLES=0 → true no-op).
      # custom_exit's time-limit branch force-closed unconditionally with zero model input.
      # If the model STILL supports the trade's direction when the deadline hits, extend it
      # by GRACE_CANDLES instead of blind-closing, capped at MAX_EXTENSIONS grants/trade.
      - FREQAI_TIME_LIMIT_GRACE=${FREQAI_TIME_LIMIT_GRACE:-0}
      - FREQAI_TIME_LIMIT_GRACE_CANDLES=${FREQAI_TIME_LIMIT_GRACE_CANDLES:-0}
      - FREQAI_TIME_LIMIT_GRACE_LEVEL=${FREQAI_TIME_LIMIT_GRACE_LEVEL:-0.0}
      - FREQAI_TIME_LIMIT_GRACE_MAX_EXTENSIONS=${FREQAI_TIME_LIMIT_GRACE_MAX_EXTENSIONS:-1}
      - FREQAI_PROGRESS_CUT_CANDLES=${FREQAI_PROGRESS_CUT_CANDLES:-3}
      - FREQAI_PROGRESS_CUT_PROFIT=${FREQAI_PROGRESS_CUT_PROFIT:--0.005}
      # Probe-scale (2026-06-23): DEFAULT OFF. Anti-martingale sizing — enter a reduced
      # probe, add to full size only once the trade confirms (goes green) within the
      # first PROBE_WINDOW candles. 2026-07-17: also missing until now (same gap class).
      - FREQAI_PROBE_SCALE=${FREQAI_PROBE_SCALE:-0}
      - FREQAI_PROBE_FRACTION=${FREQAI_PROBE_FRACTION:-0.5}
      - FREQAI_PROBE_CONFIRM_PCT=${FREQAI_PROBE_CONFIRM_PCT:-0.004}
      - FREQAI_PROBE_WINDOW=${FREQAI_PROBE_WINDOW:-2}
      # Time-limit exit horizon is now derived from config.json's label_period_candles
      # (single source of truth) inside the strategy — FREQAI_LABEL_CANDLES env var
      # removed 2026-06-21 (went stale at 12 after the 1h switch). See
      # FinBuddyFreqAI_v23._label_period_candles().
      - FREQTRADE__FREQAI__IDENTIFIER=${FREQTRADE__FREQAI__IDENTIFIER:-}
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "/home/ubuntu/var/www/html/trade/finbuddy_memory:/freqtrade/finbuddy_memory:ro"
      # WR feedback state dir — recent_wr.json at /home/ubuntu/.finbuddy/state/recent_wr.json
      # Strategy reads this file via _load_recent_wr() to adjust thresholds dynamically.
      # Without this mount the strategy silently falls back to wr=0.50 (WR feedback disabled).
      # Added 2026-05-27 to re-enable the bidirectional threshold adjustment (Fix 8).
      - "/home/ubuntu/.finbuddy:/home/ubuntu/.finbuddy:ro"
    # Expose api on port 8080, bound to the HOST's loopback interface only (127.0.0.1) —
    # not reachable from outside the server. Fixed 2026-07-05: was "8080:8080" which
    # published on 0.0.0.0 (all interfaces), confirmed reachable externally. Host-side
    # scripts (streamer.py, daily_summary.py, etc.) already call 127.0.0.1/localhost,
    # so nothing else needs to change.
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "127.0.0.1:8080:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
