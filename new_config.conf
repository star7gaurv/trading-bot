server {
    server_name trade.star7gaurav.in;

    # Freqtrade UI
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TradingView webhook receiver (Phase 6)
    location /tradingview {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Conscious Brain Dashboard UI
    location /new-dashboard {
        alias /home/ubuntu/var/www/html/trade/dashboard-ui/dist;
        try_files $uri $uri/ /new-dashboard/index.html;
    }

    # Python WebSocket Streamer
    location /ws/ {
        proxy_pass http://127.0.0.1:8501/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trade.star7gaurav.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trade.star7gaurav.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = trade.star7gaurav.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name trade.star7gaurav.in;

    listen 80;
    return 404; # managed by Certbot


}
